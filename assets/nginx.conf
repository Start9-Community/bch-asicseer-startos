server {
    listen 81 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # Static WebUI
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'" always;
    }

    # Stats API (served as static JSON, updated by background script)
    location /api/ {
        alias /var/www/html/api/;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Mutable API — proxied to the Node.js delete handler
    location = /api/delete-worker {
        proxy_pass http://127.0.0.1:8181;
        # $http_host keeps the port, which delete-worker.js compares to Origin.
        proxy_set_header Host $http_host;
        proxy_read_timeout 10s;
    }
}
